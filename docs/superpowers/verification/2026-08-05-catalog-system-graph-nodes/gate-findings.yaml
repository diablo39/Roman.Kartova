    title: "No verification ledger existed while CHECKLIST.md already claimed the story complete"
    note: "Task 11 flipped E-03.F-03.S-01 to [x] citing only the A1 and A2 ledgers. The entire record for THIS slice — the SDD ledger and all 11 task reports — sat under gitignored .superpowers/, so no completion claim was citable and the gate telemetry would have vanished at merge. Exactly the defect the A2 slice's own gate 8 caught. This file and dod.md are the fix."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "An external neighbour can render INSIDE the boundary band, which is the signal decision 7 relies on"
    note: "systemBoundaryBox is an axis-aligned box over focus + members; nothing excludes a non-member laid out within it. With dagre rankdir LR and partOf edges retained in the layout input, the System is one rank right of its members and a member's external out-neighbour can land in that same rank — the same x-column the box spans. DELIBERATELY NOT FIXED: the remedy (dim non-members via layoutGraph's existing `dimmed` argument) reverses spec decision 7, which is the owner's call. Routed to gate 9 with a specific reproduction recipe. OPEN DECISION, not a discard."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "Selecting a System node showed a bare UUID, justified by a comment that was factually false"
    note: "GraphExplorerSidebar set `active = undefined` for system under the comment 'has no detail query yet (deferred to FU-A)'. FU-A *is* this slice, and useSystem(id) already existed with the same shape as the three sibling hooks. So the widening exposed a new, degraded surface. Fixed in the fix wave: the hook is wired into the same record, the false comment is gone, and a new GraphExplorerSidebar.test.tsx asserts the display name renders and the id does not."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "ExplorerEdge.type was typed `string`, discarding the closed union the generated client already has"
    note: "The field is load-bearing and compared against a bare \"partOf\" literal at two independent sites. A typo (\"partof\") compiled, silently yielded zero members, and rendered 'No members yet.' for a populated System — a wrong-but-plausible screen. Fixed: narrowed to the generated wire union and both sites route through one exported PART_OF_TYPE constant."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "SystemDiagram can draw a dashed derived edge with no legend explaining the dash"
    note: "Its data path consumes derivedEdges and layoutGraph applies strokeDasharray, but the sibling's '— explicit / - - derived' legend was not copied, though spec §4.5 lists it among the mirrored chrome. Fixed."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "NODE_W/NODE_H duplicated across a module boundary, guarded only by a comment"
    note: "systemBoundary.ts re-declared 180/56 with a 'must match graphLayout.ts' comment while the originals were unexported; either moving would mis-size the band with no failing test. Fixed by exporting from graphLayout.ts and importing — the comment is now unnecessary rather than load-bearing."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "Five comments and test names across the branch described deferrals this slice closed"
    note: "relationshipTypeRules.ts still said `system` is 'not a graph URL token' (the opposite of the new code); its test and two graphMerge test names still called System-node rendering 'deferred (FU-A)'. The branch had correctly deleted one stale comment along with the cast it justified but left its siblings. All fixed; assertions unchanged."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "systemBoundaryBox's size was never asserted — only an inequality — so arithmetic mutations survived"
    note: "The test pinned x and y exactly but checked size via `box.x + box.width < 500`. Mutating the padding doubling or swapping NODE_W for NODE_H passed. Also uncovered: the second null guard (non-empty memberIds matching no laid-out node) and the depth-2 case of a member that also has a partOf edge to a SECOND System. All three closed by the fix wave. This is the module whose task-level review evidence was lost to truncation — so gate 6 caught what gate 2 could not report."

  - gate: requesting-review
    severity: should-fix
    verdict: real
    title: "Nothing in the frontend suite proved a member-to-member edge renders"
    note: "That edge is the entire justification for using /graph over useRelationshipsList (decision 2). It was pinned on the backend but the component fixture had a single partOf edge, so the only frontend coverage was a negative assertion that also passes when no edges render at all. Fixed with a dependsOn fixture asserting edge-count 1 and the rendered label."

  - gate: requesting-review
    severity: nit
    verdict: real
    title: "Eight polish items: no-op cast, truncation wording, stray top-level test, node-component signature, stringly-typed label record, dead narrowing branch"
    note: "Four were fixed in the wave (no-op cast, banner wording with its test matcher, the stray top-level `it`, the SystemBoundaryNode signature now matching NodeProps). The rest were left: ENTITY_KIND_LABEL staying Record<string,string>, GraphExplorerPage's inert narrowing branch, SystemMembersSection's isRelationshipKind link guard, and the per-render memo recomputation inherited verbatim from GraphExplorerPage. None affects behaviour."

