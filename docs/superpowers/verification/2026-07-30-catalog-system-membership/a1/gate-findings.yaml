# gate-findings.yaml — per-gate findings telemetry for one slice.
#
# Purpose: record every issue each DoD gate raised, with a real/delusion verdict,
# so gate effectiveness is queryable across slices.
#   Aggregate:  find docs/superpowers/verification -name gate-findings.yaml
#   Rank gates by precision (real ÷ found) and by real issues caught.
#
# Sibling of dod.md in docs/superpowers/verification/<date>-<topic>/.
# dod.md records each gate's PASS/FAIL/PENDING/N-A status; this file records what it FOUND.
# A gate with status PASS and no entries here => it ran and found nothing.

slice:  2026-07-30-catalog-system-membership/a1
branch: feat/catalog-system-membership-a1
head:   283eac2f

# One entry per issue a gate raised. Source: .superpowers/sdd/2026-07-30-catalog-system-membership-a1/progress.md
# (per-task review outcomes) unless noted otherwise. Every finding below was real and acted
# on except where explicitly marked delusion / equivalent-mutant (not a coverage gap).
findings:
  - gate: reviews
    severity: blocking
    verdict: real
    title: "Task 3 forwarded finding: new unique index made unguarded POST /catalog/relationships PartOf path return 500 instead of 201 for a second System"
    note: "Existing CreatePartOfRelationshipTests only re-posted the identical edge (caught by the exact-duplicate pre-check), so the 56/56 regression stayed green without exercising this. THE BRANCH MUST NOT MERGE WITHOUT TASK 4 (per progress.md). Fixed in Task 4, commit b2f36ec6 — implementer proved the regression by reverting the fix and watching both Application- and Service-source tests fail InternalServerError, then restored it -> Conflict."

